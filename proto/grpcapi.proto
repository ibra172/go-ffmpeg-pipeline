syntax = "proto3";

// protoc --go_out=. --go-grpc_out=. --go-grpc_opt=paths=source_relative --go_opt=paths=source_relative *.proto  
option go_package = "./;grpcapi";

package grpcapi;

message TaskID {
  string ID = 1;
}

message TaskStatus {
  string inProgress = 1;
  string ready = 2;
  string error = 3;
}

message TaskResult {
  string outputPath = 1;
  string errorMsg = 2;
}

service Processor {
    rpc CommitTaskResult (TaskID, TaskID, TaskResult) returns (TaskResult) {}
    
}

