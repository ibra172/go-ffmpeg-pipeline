name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare environment config
        run: cp .env.example .env

      - name: Lint
        run: make lint GO_BIN=go

      - name: Build
        run: make build GO_BIN=go

      - name: Test
        run: make test GO_BIN=go

      - name: Race detector
        run: go test -race ./...