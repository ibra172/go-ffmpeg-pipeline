services:
  app:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/app/Dockerfile
    container_name: media-pipeline-app
    ports:
      - "8000:8000"
    env_file:
      - ${PROJECT_ROOT}/.env
    volumes:
      - ${PROJECT_ROOT}/data:/data
    depends_on:
      queue:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/worker/Dockerfile
    env_file:
      - ${PROJECT_ROOT}/.env
    volumes:
      - ${PROJECT_ROOT}/data:/data
      - ${PROJECT_ROOT}/resources:/resources
    depends_on:
      queue:
        condition: service_healthy
  
  queue:
    image: "rabbitmq:4.3-management-alpine"
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 30s
      retries: 3

  postgres:
    image: postgres:18-bookworm
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: env-port-forwarder
    entrypoint: |
      /bin/sh -c "
        socat -d -d tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432 &
        wait
      "
    ports:
      - "127.0.0.1:5432:5432"
    profiles: ["db-access"]
  
  postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
