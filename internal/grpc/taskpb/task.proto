syntax = "proto3";

package task.v1;

option go_package = "github.com/ibra172/go-ffmpeg-pipeline/internal/grpc/taskpb;taskpb";

service TaskService {
    rpc CommitTaskResult (TaskMessageRequest) returns (TaskMessageResponse) {}
    rpc GetTaskStatus (GetTaskStatusRequest) returns (GetTaskStatusResponse) {}
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_IN_PROGRESS = 1;
  STATUS_READY = 2;
  STATUS_ERROR = 3;
}

message Result {
  string output_path = 1;
  string error_msg = 2;
}

message TaskMessageRequest {
  string task_id = 1;
  Status status = 2;
  Result result = 3;
}

message TaskMessageResponse {
  reserved 1;
  reserved "success";
}

message GetTaskStatusRequest {
  string task_id = 1;
}

message GetTaskStatusResponse {
  Status status = 1;
}
