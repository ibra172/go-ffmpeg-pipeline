basePath: /
definitions:
  auth.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    type: object
  auth.LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    type: object
  auth.RegisterResponse:
    properties:
      user_id:
        type: string
      username:
        type: string
    type: object
  httpresp.ErrorResponse:
    properties:
      error:
        description: Error holds a public error message.
        type: string
    type: object
  task.CreateTaskResponse:
    properties:
      task_id:
        description: TaskID is the generated UUID of the created task.
        type: string
    type: object
  task.TaskResultResponse:
    properties:
      error:
        type: string
      output_path:
        type: string
      status:
        type: string
    type: object
  task.TaskStatusResponse:
    properties:
      status:
        description: Status can be in_progress, ready, or error.
        type: string
    type: object
host: 127.0.0.1:8000
info:
  contact: {}
  description: Asynchronous video processing API using FFmpeg. Register and log in,
    then enter Bearer <token> in Authorize to access protected endpoints.
  title: Media Pipeline App API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates an existing user and returns a valid bearer token
        for protected routes.
      parameters:
      - description: User login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User logged in successfully
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: 'Creates a user account. Username: 3–30 ASCII letters, digits or
        underscores, starting with a letter; uniqueness is case-insensitive. Password:
        8–72 bytes.'
      parameters:
      - description: User registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Invalid JSON or registration parameters
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /result/{id}:
    get:
      description: Returns the processing result as output path for a task when it
        is finished. For failed tasks, the API returns the error message instead of
        the output artifact.
      parameters:
      - description: Task ID in UUID format
        example: 123e4567-e89b-12d3-a456-426614174000
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Task finished (see status field for success/error)
          schema:
            $ref: '#/definitions/task.TaskResultResponse'
        "202":
          description: Task is still being processed
          schema:
            $ref: '#/definitions/task.TaskStatusResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "404":
          description: Task not found or belongs to another user
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get task result
      tags:
      - task
  /status/{id}:
    get:
      description: Returns the current processing state of a task. The public status
        values are in_progress, ready, and error.
      parameters:
      - description: Task ID in UUID format
        example: 123e4567-e89b-12d3-a456-426614174000
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Current task status
          schema:
            $ref: '#/definitions/task.TaskStatusResponse'
        "202":
          description: Task is still processing
          schema:
            $ref: '#/definitions/task.TaskStatusResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "404":
          description: Task not found or belongs to another user
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get task status
      tags:
      - task
  /task:
    post:
      consumes:
      - multipart/form-data
      description: Creates a new media-processing job. The task is queued immediately
        and can be checked by its UUID through the status and result endpoints.
      parameters:
      - description: Video file
        in: formData
        name: video
        required: true
        type: file
      - description: Processing operation
        enum:
        - transcode
        - thumbnail
        - watermark
        in: formData
        name: operation
        required: true
        type: string
      - description: Required for transcode
        enum:
        - mp4
        - mov
        - mkv
        - webm
        in: formData
        name: target_format
        type: string
      - description: Optional transcode resolution
        enum:
        - 360p
        - 480p
        - 720p
        - 1080p
        - 4k
        in: formData
        name: resolution
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
          schema:
            $ref: '#/definitions/task.CreateTaskResponse'
        "400":
          description: Invalid multipart form or task parameters
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "405":
          description: Invalid method
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresp.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create processing task
      tags:
      - task
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
